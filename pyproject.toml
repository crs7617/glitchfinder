[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glitchfinder"
version = "0.1.0"
description = "Detect under-trained (glitch) tokens in open-weight LLMs"
requires-python = ">=3.12"
dependencies = [
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
    "transformers>=4.36",
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
glitchfinder = "glitchfinder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glitchfinder"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
